<!DOCTYPE html>
<!--
  panel.html – UI rendered inside the NetContext DevTools panel.

  Elements:
    #request-count        – live counter showing number of captured requests.
    #copy-btn             – triggers clipboard copy of the JSON log.
    #copy-cart-btn        – extracts cart_items from responses and copies as JSON.
    #download-images-btn  – downloads product images in Snap-Door {SKU}/main.<ext> ZIP format.
    #toggle-debug-btn     – toggles the built-in diagnostic console drawer.
    #clear-btn            – clears the current log.
    #status-msg           – confirmation / error feedback message.
    #log-table            – table that lists captured requests.
    #debug-drawer         – live diagnostic log drawer for debugging extraction & image downloads.
-->
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>NetContext</title>
  <style>
    /* ── Reset & base ──────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #202124;
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Toolbar ───────────────────────────────────────────────────── */
    #toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #dadce0;
      background: #f8f9fa;
      flex-shrink: 0;
    }

    #toolbar h1 {
      font-size: 14px;
      font-weight: 600;
      color: #1a73e8;
      margin-right: auto;
    }

    /* ── Buttons ───────────────────────────────────────────────────── */
    button {
      padding: 5px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    button:hover {
      background: #e8f0fe;
      border-color: #1a73e8;
      color: #1a73e8;
    }

    button:active {
      background: #d2e3fc;
    }

    /* ── Inputs ────────────────────────────────────────────────────── */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .filter-group label {
      font-size: 12px;
      color: #5f6368;
      white-space: nowrap;
    }

    .filter-group input {
      padding: 4px 8px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 12px;
      width: 150px;
      outline: none;
    }

    .filter-group input:focus {
      border-color: #1a73e8;
    }

    #copy-btn {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    #copy-btn:hover {
      background: #1557b0;
      border-color: #1557b0;
      color: #fff;
    }

    #copy-btn:active {
      background: #0d47a1;
    }

    #copy-cart-btn {
      background: #188038;
      color: #fff;
      border-color: #188038;
    }

    #copy-cart-btn:hover {
      background: #0d652d;
      border-color: #0d652d;
      color: #fff;
    }

    #copy-cart-btn:active {
      background: #0a4f23;
    }

    #copy-cart-btn:disabled {
      background: #5f6368;
      border-color: #5f6368;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #download-images-btn {
      background: #673ab7;
      color: #fff;
      border-color: #673ab7;
    }

    #download-images-btn:hover {
      background: #512da8;
      border-color: #512da8;
      color: #fff;
    }

    #download-images-btn:active {
      background: #311b92;
    }

    #download-images-btn:disabled {
      background: #5f6368;
      border-color: #5f6368;
      color: #fff;
      cursor: not-allowed;
      opacity: 0.75;
    }

    #toggle-debug-btn.active {
      background: #202124;
      color: #fff;
      border-color: #202124;
    }

    /* ── Request counter ───────────────────────────────────────────── */
    #request-count {
      font-size: 12px;
      color: #5f6368;
      white-space: nowrap;
    }

    /* ── Status message ────────────────────────────────────────────── */
    #status-msg {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 3px;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
    }

    #status-msg.visible {
      opacity: 1;
    }

    #status-msg.success {
      color: #137333;
      background: #e6f4ea;
    }

    #status-msg.error {
      color: #b31412;
      background: #fce8e6;
    }

    /* ── Log table ─────────────────────────────────────────────────── */
    #table-wrapper {
      flex: 1;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      position: sticky;
      top: 0;
      background: #f1f3f4;
      z-index: 1;
    }

    th,
    td {
      padding: 5px 8px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      font-weight: 600;
      font-size: 12px;
      color: #5f6368;
    }

    /* Column widths */
    col.col-method {
      width: 60px;
    }

    col.col-status {
      width: 50px;
    }

    col.col-url {
      width: auto;
    }

    col.col-timestamp {
      width: 170px;
    }

    tr:hover td {
      background: #e8f0fe;
    }

    /* Status-code colours */
    td.status-ok {
      color: #137333;
    }

    td.status-redir {
      color: #e37400;
    }

    td.status-err {
      color: #b31412;
    }

    /* ── Empty state ───────────────────────────────────────────────── */
    #empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #80868b;
      height: 100%;
      font-size: 13px;
    }

    #empty-state svg {
      opacity: 0.4;
    }

    /* ── Debug Console Drawer ──────────────────────────────────────── */
    #debug-drawer {
      display: none;
      flex-direction: column;
      height: 210px;
      border-top: 2px solid #202124;
      background: #1e1e1e;
      color: #d4d4d4;
      flex-shrink: 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
    }

    #debug-drawer.open {
      display: flex;
    }

    #debug-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      background: #2d2d2d;
      border-bottom: 1px solid #3e3e3e;
      color: #fff;
      font-weight: 600;
    }

    #debug-header span {
      margin-right: auto;
    }

    #debug-header button {
      padding: 2px 8px;
      font-size: 11px;
      background: #3c4043;
      color: #e8eaed;
      border-color: #5f6368;
    }

    #debug-header button:hover {
      background: #5f6368;
      color: #fff;
    }

    #debug-logs {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .dbg-line {
      margin-bottom: 2px;
    }

    .dbg-info {
      color: #9cdcfe;
    }

    .dbg-success {
      color: #6a9955;
    }

    .dbg-warn {
      color: #dcdcaa;
    }

    .dbg-error {
      color: #f48771;
    }
  </style>
</head>

<body>

  <!-- ── Toolbar ──────────────────────────────────────────────────── -->
  <div id="toolbar">
    <h1>NetContext</h1>

    <div class="filter-group">
      <label for="base-url-filter">Base URL:</label>
      <input type="text" id="base-url-filter" placeholder="e.g. https://api.com" />
    </div>

    <div class="filter-group">
      <label for="exact-url-filter">Exact URL:</label>
      <input type="text" id="exact-url-filter" placeholder="e.g. https://api.com/users" />
    </div>

    <span id="request-count">0 requests</span>

    <button id="copy-btn" title="Copy all captured requests as pretty-printed JSON">
      Copy JSON Logs
    </button>

    <button id="copy-cart-btn" title="Extract all unique cart_items from captured responses and copy as JSON">
      🛒 Copy Cart Items
    </button>

    <button id="download-images-btn" title="Download product images as a ZIP ({product_id}/main.png) ready for Snap-Door bulk image upload">
      🖼️ Download SKU Images
    </button>

    <button id="toggle-debug-btn" title="Open/close the live diagnostic log drawer">
      🐞 Debug
    </button>

    <button id="clear-btn" title="Clear the current log">
      Clear
    </button>

    <span id="status-msg" role="status" aria-live="polite"></span>
  </div>

  <!-- ── Log table ─────────────────────────────────────────────────── -->
  <div id="table-wrapper">

    <!-- Empty-state placeholder (hidden once requests arrive) -->
    <div id="empty-state">
      <!-- Simple network-icon SVG, inline to avoid extra file -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1
                   14H9V8h2v8zm4 0h-2V8h2v8z" fill="#80868b" />
      </svg>
      <p>No fetch / XHR requests captured yet.</p>
      <p>Navigate to a page and trigger network activity.</p>
    </div>

    <table id="log-table" style="display:none">
      <colgroup>
        <col class="col-method" />
        <col class="col-status" />
        <col class="col-url" />
        <col class="col-timestamp" />
      </colgroup>
      <thead>
        <tr>
          <th>Method</th>
          <th>Status</th>
          <th>URL</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody id="log-tbody"></tbody>
    </table>

  </div>

  <!-- ── Live Diagnostic Console Drawer ───────────────────────────── -->
  <div id="debug-drawer">
    <div id="debug-header">
      <span>🐞 NetContext Diagnostic Console</span>
      <button id="copy-debug-btn" title="Copy all diagnostic logs to clipboard">Copy Debug Log</button>
      <button id="clear-debug-btn" title="Clear diagnostic logs">Clear</button>
      <button id="close-debug-btn" title="Hide diagnostic console">✕</button>
    </div>
    <div id="debug-logs"></div>
  </div>

  <script src="cart-item-extractor.js"></script>
  <script src="cart-items-manager.js"></script>
  <script src="zip-builder.js"></script>
  <script src="panel.js"></script>
</body>

</html>
