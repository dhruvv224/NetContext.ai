name: Enforce Branch Protection

# This workflow applies branch protection rules to the `main` branch.
#
# SETUP REQUIRED:
#   1. Create a Personal Access Token (PAT) with the `repo` scope in your
#      GitHub account settings: https://github.com/settings/tokens
#   2. Add the PAT as a repository secret named `REPO_ADMIN_TOKEN`:
#      Settings → Secrets and variables → Actions → New repository secret
#   3. Run this workflow manually from the Actions tab (workflow_dispatch).
#
# The workflow also re-runs automatically whenever this file changes on main.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to apply branch protection rules to main'
        required: true
        default: 'yes'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/branch-protection.yml'

permissions:
  contents: read

jobs:
  protect-main:
    name: Apply Branch Protection Rules
    runs-on: ubuntu-latest
    steps:
      - name: Apply branch protection to main
        uses: actions/github-script@v7
        with:
          # Branch protection requires a PAT with `repo` scope.
          # Set the REPO_ADMIN_TOKEN secret in repository settings.
          github-token: ${{ secrets.REPO_ADMIN_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const branch = 'main';

            console.log(`Applying branch protection rules to ${owner}/${repo}:${branch}`);

            await github.rest.repos.updateBranchProtection({
              owner,
              repo,
              branch,
              required_status_checks: null,
              enforce_admins: true,
              required_pull_request_reviews: {
                dismiss_stale_reviews: true,
                require_code_owner_reviews: true,
                required_approving_review_count: 1,
              },
              restrictions: null,
              allow_force_pushes: false,
              allow_deletions: false,
              block_creations: false,
              required_conversation_resolution: true,
            });

            console.log('✅ Branch protection applied successfully!');
            console.log('Rules enforced:');
            console.log('  - Pull Request required before merging');
            console.log('  - At least 1 approving review required');
            console.log('  - Code owner review required (CODEOWNERS)');
            console.log('  - Stale reviews dismissed on new commits');
            console.log('  - All conversations must be resolved');
            console.log('  - Force pushes blocked');
            console.log('  - Branch deletions blocked');
            console.log('  - Rules enforced for admins too');
