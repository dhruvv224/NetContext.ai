<!DOCTYPE html>
<!--
  devtools.html – Entry point for the Chrome DevTools extension page.

  Chrome loads this page when DevTools is opened.  It must be a valid HTML
  file but the page itself is never rendered to the user – it only exists to
  run devtools.js which registers the custom panel.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NetContext DevTools</title>
  </head>
  <body>
    <script src="devtools.js"></script>
  </body>
</html>
